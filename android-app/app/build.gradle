plugins { id 'com.android.application' }

android {
    namespace 'com.dsh.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dsh.android'
        minSdk 24
        // targetSdk 28 is deliberate: Android 10+ refuses execve() on files the app owns inside
        // its own data dir, which would make the bundled Termux prefix (bash, python, clang, tar,
        // proot) unusable -- the same constraint the VS Code port documents. It is the only way an
        // app may run binaries from its own directory.
        targetSdk 28
        versionCode 3
        versionName '0.3.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Debuggable on purpose, like the VS Code port: run-as is how files/ gets inspected,
            // and without it every verification has to go through screenshots over adb taps, which
            // this ROM answers unreliably.
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Legacy packaging => the native libs are EXTRACTED to nativeLibraryDir,
    // which is the only app-writable path Android still allows execve from.
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    androidResources {
        // node_modules contains files aapt would otherwise mangle/compress
        noCompress += ['tar', 'zst', 'node', 'so', 'zip']
    }
}
