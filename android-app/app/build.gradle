plugins { id 'com.android.application' }

android {
    namespace 'com.dsh.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dsh.android'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Debuggable on purpose, like the VS Code port: run-as is how files/ gets inspected,
            // and without it every verification has to go through screenshots over adb taps, which
            // this ROM answers unreliably.
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Legacy packaging => the native libs are EXTRACTED to nativeLibraryDir,
    // which is the only app-writable path Android still allows execve from.
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    androidResources {
        // node_modules contains files aapt would otherwise mangle/compress
        noCompress += ['tar', 'zst', 'node', 'so', 'zip']
    }
}
